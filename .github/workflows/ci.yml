name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (Debian trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
      # Installed before checkout so actions/checkout can use real git rather
      # than falling back to a tarball download.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential valac meson ninja-build pkg-config \
            libglib2.0-dev libglib2.0-dev-bin libjson-glib-dev \
            libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev \
            gettext desktop-file-utils appstream \
            git ca-certificates

      - uses: actions/checkout@v7

      - name: Configure
        run: meson setup _build --prefix=/usr

      - name: Compile
        run: meson compile -C _build

      # Validates the desktop entry, the AppStream metadata and the GSettings schema.
      - name: Test
        run: meson test -C _build --print-errorlogs

      - name: Staged install
        run: meson install -C _build --destdir=/tmp/stage

      - name: Upload Meson logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs
          path: _build/meson-logs/
          if-no-files-found: ignore

  macos:
    name: macOS app (Apple silicon)
    # macos-15 is the current generally available image, and arm64 — which is
    # what the bundle this job uploads is built for. macos-26-arm64 exists as a
    # label but never picked up a runner: the job sat queued while every other
    # job in the workflow finished.
    runs-on: macos-15
    # A bundling step that stops to ask a question has nobody to answer it, and
    # the default limit for that is six hours of a runner. Half an hour is
    # already four times the honest build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # gettext is keg-only, so msgfmt is not linked into the prefix; the build
      # needs it on PATH. dylibbundler is what makes the result self-contained.
      - name: Install build dependencies
        run: |
          brew install --quiet meson ninja vala gtk4 libadwaita json-glib \
            librsvg gettext dylibbundler
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      # Builds, runs the suite, assembles and signs the bundle — the same script
      # a developer with Homebrew runs, so a green job means that command works.
      - name: Build the bundle
        run: tools/build-macos-app.sh

      # The bundle must not reach outside itself. A single Homebrew path left in
      # a load command is the difference between an app that runs on any Mac and
      # one that runs only on the machine that built it, and nothing else in
      # this job would notice.
      - name: Check that nothing links back to Homebrew
        run: |
          app="dist/Networking Lab.app"
          leaked=$(
            find "$app/Contents/MacOS" "$app/Contents/libs" -type f -perm +111 \
              -exec otool -L {} + | grep -E '/opt/homebrew|/usr/local/(Cellar|opt)' || true
          )
          if [ -n "$leaked" ]; then
            echo "$leaked"
            exit 1
          fi
          echo "no Homebrew paths in any load command"

      # Starting the process proves every dylib resolves and the schemas are
      # where the launcher says. --help returns before a window is needed, which
      # is as far as a headless runner can go.
      - name: Smoke test
        run: |
          "dist/Networking Lab.app/Contents/MacOS/networking-lab" --help
          # Every Mach-O, not the bundle: the bundle's main executable is the
          # launcher script, which cannot carry a signature. What has to be
          # valid for macOS to run this at all on Apple silicon is each
          # Mach-O's own.
          find "dist/Networking Lab.app/Contents" -type f \
            \( -name '*.dylib' -o -name '*.so' -o -name 'networking-lab-bin' \) \
            -exec codesign --verify --strict {} +
          echo "every Mach-O in the bundle verifies"

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: networking-lab-macos-arm64
          path: dist/NetworkingLab-macos-*.zip

      - name: Upload Meson logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: meson-logs-macos
          path: _build-macos/meson-logs/
          if-no-files-found: ignore

  flatpak:
    name: Flatpak (GNOME 50)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Two packages that --no-install-recommends would otherwise leave out, both
      # needed by post-build steps rather than by the build itself:
      #   elfutils        - eu-strip, which flatpak-builder uses to split debuginfo
      #   librsvg2-common - the gdk-pixbuf SVG loader. Without it `appstreamcli
      #                     compose` cannot rasterise the SVG app icon and fails
      #                     with a bare "E: file-read-error".
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils librsvg2-common

      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install runtime and SDK
        run: |
          flatpak install --user -y --noninteractive \
            flathub org.gnome.Platform//50 org.gnome.Sdk//50

      # rofiles-fuse is unavailable on hosted runners.
      - name: Build
        run: |
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo=_repo _flatpak io.github.fwilhe2.NetworkingLab.json

      - name: Create bundle
        run: |
          flatpak build-bundle _repo networking-lab.flatpak io.github.fwilhe2.NetworkingLab \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: networking-lab-flatpak
          path: networking-lab.flatpak

  container:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # The Containerfile runs `meson test` in its builder stage, so this job
      # gates on the test suite as well as on the image building.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Both package jobs run the same scripts a developer runs, inside the same
  # distribution containers, so a green job means the documented command works
  # rather than that some CI-only variant of it does.
  deb:
    name: Debian package (trixie)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The build runs meson test inside the container, so this job gates on
      # the suite as well as on the packaging.
      - name: Build
        run: tools/build-deb.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: networking-lab-deb
          path: dist/*.deb

  rpm:
    name: RPM package (Fedora 44)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: tools/build-rpm.sh

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: networking-lab-rpm
          # The debuginfo and debugsource subpackages come along; they are the
          # difference between a useful backtrace and an address.
          path: dist/*.rpm
