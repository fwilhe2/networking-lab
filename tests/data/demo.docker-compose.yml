# Container network lab, generated by NetLab Designer.
# Requires docker compose v2.23.1+ for inline configs.content.
#
#   docker compose up -d      start the lab
#   docker compose down       stop it and remove the networks
#
# Router CLI:
#   docker exec -it r1 vtysh
#   docker exec -it r2 vtysh
#
# Host shells:
#   docker exec -it pc1 sh
#   docker exec -it srv1 sh

name: netlab-demo

services:
  pc1:
    image: alpine:3.20
    container_name: pc1
    hostname: pc1
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route del default 2>/dev/null || true; ip route add default via 10.0.1.1; sleep infinity"]
    networks:
      sw1:  # eth0
        ipv4_address: 10.0.1.10
        priority: 100

  r1:
    image: quay.io/frrouting/frr:10.1.2
    container_name: r1
    hostname: r1
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    configs:
      - { source: frr_daemons, target: /etc/frr/daemons, mode: 0644 }
      - { source: frr_vtysh, target: /etc/frr/vtysh.conf, mode: 0644 }
      - { source: r1_frr, target: /etc/frr/frr.conf, mode: 0644 }
    networks:
      sw1:  # eth0
        ipv4_address: 10.0.1.1
        priority: 100
      p2p_r1_r2:  # eth1
        ipv4_address: 10.0.3.1
        priority: 99

  r2:
    image: quay.io/frrouting/frr:10.1.2
    container_name: r2
    hostname: r2
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
    configs:
      - { source: frr_daemons, target: /etc/frr/daemons, mode: 0644 }
      - { source: frr_vtysh, target: /etc/frr/vtysh.conf, mode: 0644 }
      - { source: r2_frr, target: /etc/frr/frr.conf, mode: 0644 }
    networks:
      p2p_r1_r2:  # eth0
        ipv4_address: 10.0.3.2
        priority: 100
      sw2:  # eth1
        ipv4_address: 10.0.2.1
        priority: 99

  srv1:
    image: python:3.12-alpine
    container_name: srv1
    hostname: srv1
    cap_add: [NET_ADMIN]
    command: ["sh", "-c", "ip route del default 2>/dev/null || true; ip route add default via 10.0.2.1; python -m http.server 80"]
    networks:
      sw2:  # eth0
        ipv4_address: 10.0.2.10
        priority: 100

networks:
  sw1:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.254  # reserved for docker, don't assign to devices
  sw2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.2.0/24
          gateway: 10.0.2.254  # reserved for docker, don't assign to devices
  p2p_r1_r2:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.0.3.0/24
          gateway: 10.0.3.254  # reserved for docker, don't assign to devices

configs:
  frr_daemons:
    content: |
      zebra=yes
      staticd=yes
      ospfd=yes
      ospf6d=yes
      bgpd=yes
      ripd=yes
      isisd=yes
      vtysh_enable=yes
      zebra_options=" -A 127.0.0.1 -s 90000000"
      ospfd_options=" -A 127.0.0.1"
      ospf6d_options=" -A ::1"
      bgpd_options="  -A 127.0.0.1"
      ripd_options="  -A 127.0.0.1"
      isisd_options=" -A 127.0.0.1"
      staticd_options="-A 127.0.0.1"
  frr_vtysh:
    content: |
      service integrated-vtysh-config
  r1_frr:
    content: |
      frr defaults traditional
      hostname r1
      service integrated-vtysh-config
      !
      interface eth0
       description sw1
       ip address 10.0.1.1/24
      !
      interface eth1
       description p2p_r1_r2
       ip address 10.0.3.1/24
      !
      router ospf
       network 10.0.0.0/8 area 0
      !
      line vty
  r2_frr:
    content: |
      frr defaults traditional
      hostname r2
      service integrated-vtysh-config
      !
      interface eth0
       description p2p_r1_r2
       ip address 10.0.3.2/24
      !
      interface eth1
       description sw2
       ip address 10.0.2.1/24
      !
      router ospf
       network 10.0.0.0/8 area 0
      !
      line vty
